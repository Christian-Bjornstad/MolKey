<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- MolKey E - Helix Bow: the key's bow IS a double helix -->
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#847CBA"/>
      <stop offset="1" stop-color="#46407A"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgE)"/>
  <g fill="none" stroke-linecap="round">
    <!-- two mirrored helix strands forming a ring -->
    <path d="M128 40 C 168 52, 172 96, 150 116 C 138 127, 138 141, 150 152 C 172 172, 168 216, 128 228"
          stroke="#FFFFFF" stroke-width="12"/>
    <path d="M128 40 C 88 52, 84 96, 106 116 C 118 127, 118 141, 106 152 C 84 172, 88 216, 128 228"
          stroke="#DDD9EE" stroke-width="12"/>
    <!-- base pairs across both lobes -->
    <g stroke="#FFFFFF" stroke-width="6">
      <line x1="103" y1="62" x2="153" y2="62"/>
      <line x1="95" y1="86" x2="161" y2="86"/>
      <line x1="99" y1="108" x2="157" y2="108"/>
      <line x1="99" y1="160" x2="157" y2="160"/>
      <line x1="95" y1="182" x2="161" y2="182"/>
      <line x1="103" y1="206" x2="153" y2="206"/>
    </g>
    <!-- solid key shaft + teeth down the middle -->
    <line x1="128" y1="112" x2="128" y2="196" stroke="#FFFFFF" stroke-width="13"/>
    <line x1="134" y1="146" x2="156" y2="146" stroke="#FFFFFF" stroke-width="10"/>
    <line x1="134" y1="170" x2="150" y2="170" stroke="#FFFFFF" stroke-width="10"/>
  </g>
</svg>
