<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- MolKey J - Plasmid Key: circular DNA ring as the bow, restriction-site ticks -->
  <defs>
    <linearGradient id="bgJ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6FA"/>
      <stop offset="1" stop-color="#DDD9EE"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgJ)"/>
  <!-- plasmid ring -->
  <circle cx="114" cy="102" r="46" fill="none" stroke="#5E5794" stroke-width="14"/>
  <circle cx="114" cy="102" r="9" fill="#847CBA"/>
  <!-- restriction-site ticks -->
  <g stroke="#847CBA" stroke-width="6" stroke-linecap="round">
    <line x1="141" y1="75" x2="153" y2="63"/>
    <line x1="87" y1="75" x2="75" y2="63"/>
    <line x1="87" y1="129" x2="75" y2="141"/>
    <line x1="141" y1="129" x2="153" y2="141"/>
  </g>
  <!-- shaft and teeth -->
  <line x1="162" y1="102" x2="212" y2="102" stroke="#5E5794" stroke-width="13" stroke-linecap="round"/>
  <line x1="206" y1="108" x2="206" y2="126" stroke="#5E5794" stroke-width="10" stroke-linecap="round"/>
  <line x1="190" y1="108" x2="190" y2="121" stroke="#5E5794" stroke-width="10" stroke-linecap="round"/>
</svg>
