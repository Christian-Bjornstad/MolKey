<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- MolKey Concept C - Helix Key -->
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6FA"/>
      <stop offset="1" stop-color="#DDD9EE"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgC)"/>
  <!-- bow: double ring -->
  <circle cx="128" cy="92" r="34" fill="none" stroke="#5E5794" stroke-width="14"/>
  <circle cx="128" cy="92" r="10" fill="#847CBA"/>
  <!-- helix shaft: two mirrored waves -->
  <g fill="none" stroke-linecap="round">
    <path d="M116 130 C 148 148, 108 168, 140 186 C 164 199, 132 212, 150 222"
          stroke="#847CBA" stroke-width="12"/>
    <path d="M140 130 C 108 148, 148 168, 116 186 C 92 199, 124 212, 106 222"
          stroke="#5E5794" stroke-width="12"/>
    <!-- base pairs -->
    <g stroke="#B8B4D8" stroke-width="6">
      <line x1="121" y1="141" x2="135" y2="141"/>
      <line x1="127" y1="159" x2="129" y2="159"/>
      <line x1="121" y1="177" x2="135" y2="177"/>
      <line x1="115" y1="195" x2="141" y2="195"/>
      <line x1="121" y1="213" x2="135" y2="213"/>
    </g>
  </g>
</svg>
