<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- MolKey Concept B - MK Key Monogram -->
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#847CBA"/>
      <stop offset="1" stop-color="#46407A"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgB)"/>
  <!-- key bow with MK monogram -->
  <circle cx="96" cy="128" r="56" fill="none" stroke="#FFFFFF" stroke-width="18"/>
  <text x="96" y="145" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">MK</text>
  <!-- shaft and teeth -->
  <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
    <line x1="152" y1="128" x2="216" y2="128"/>
    <line x1="196" y1="128" x2="196" y2="152"/>
    <line x1="216" y1="128" x2="216" y2="160"/>
  </g>
</svg>
