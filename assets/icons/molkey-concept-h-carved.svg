  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgH)"/>
  <!-- solid key silhouette -->
  <circle cx="128" cy="82" r="38" fill="#F7F6FA"/>
  <circle cx="128" cy="82" r="14" fill="#33305E"/>
