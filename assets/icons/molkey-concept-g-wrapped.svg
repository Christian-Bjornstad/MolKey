<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- MolKey G - Wrapped Shaft: a helix weaves around a horizontal key shaft -->
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6FA"/>
      <stop offset="1" stop-color="#DDD9EE"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgG)"/>
  <!-- bow -->
  <circle cx="72" cy="128" r="32" fill="none" stroke="#5E5794" stroke-width="13"/>
  <circle cx="72" cy="128" r="8" fill="#847CBA"/>
  <!-- shaft -->
  <line x1="108" y1="128" x2="204" y2="128" stroke="#5E5794" stroke-width="13" stroke-linecap="round"/>
  <!-- helix strand weaving over the shaft -->
  <path d="M108 128 C 124 120, 140 136, 156 128 C 172 120, 188 136, 204 128"
        fill="none" stroke="#DDD9EE" stroke-width="5" opacity="0.95"/>
  <!-- tilted base-pair rungs -->
  <g stroke="#B8B4D8" stroke-width="6" stroke-linecap="round">
    <line x1="119" y1="116" x2="133" y2="140"/>
    <line x1="137" y1="140" x2="151" y2="116"/>
    <line x1="155" y1="116" x2="169" y2="140"/>
    <line x1="173" y1="140" x2="187" y2="116"/>
  </g>
  <!-- teeth -->
  <line x1="204" y1="134" x2="204" y2="152" stroke="#5E5794" stroke-width="12" stroke-linecap="round"/>
  <line x1="188" y1="134" x2="188" y2="146" stroke="#5E5794" stroke-width="10" stroke-linecap="round"/>
</svg>
