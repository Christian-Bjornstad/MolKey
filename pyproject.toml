[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "molkey"
version = "0.2.0"
description = "MolKey - permanent patient pseudonym registry for molecular pathology"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
dependencies = [
    "PyQt6>=6.7,<7",
    "platformdirs>=4.3,<5",
    "portalocker>=3,<4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "pytest-qt>=4.4,<5",
    "ruff>=0.8,<1",
]

[project.scripts]
molkey = "molkey.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/molkey"]

[tool.hatch.build.targets.wheel.force-include]
"assets/molkey_icon.ico" = "molkey/assets/molkey_icon.ico"
"assets/molkey_icon_16.png" = "molkey/assets/molkey_icon_16.png"
"assets/molkey_icon_32.png" = "molkey/assets/molkey_icon_32.png"
"assets/molkey_icon_64.png" = "molkey/assets/molkey_icon_64.png"
"assets/molkey_icon_256.png" = "molkey/assets/molkey_icon_256.png"
"assets/molkey_icon_512.png" = "molkey/assets/molkey_icon_512.png"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
qt_api = "pyqt6"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["molkey"]

[[tool.mypy.overrides]]
module = "molkey.ui.*"
# PyQt6's runtime accepts Qt property keywords that its type stubs omit.
disable_error_code = ["call-arg", "call-overload", "union-attr"]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "pytest-qt>=4.4,<5",
    "ruff>=0.8,<1",
]
